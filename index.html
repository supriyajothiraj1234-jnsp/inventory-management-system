<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📦 Inventory Management System</h1>
    <p>Simple Inventory Management</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="add-product.html">Add Product</a>
</nav>

<div class="container">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <p id="totalStock">0</p>
        </div>

        <div class="card">
            <h3>Low Stock</h3>
            <p id="lowStock">0</p>
        </div>

        <div class="card">
            <h3>Categories</h3>
            <p id="categories">0</p>
        </div>

    </div>

    <h2>Inventory Overview</h2>

    <p>
        This system helps users manage products, stock quantity,
        price, category and supplier information easily.
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
